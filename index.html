<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog del Amor - Galería de Imágenes</title>
    
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://googletagmanager.com"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LVPMF9PPL4');
    </script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff0f5; text-align: center; padding: 20px; }
        h1 { color: #d63384; font-size: 2.5rem; margin-bottom: 5px; }
        p { color: #6c757d; font-size: 1.1rem; }
        .galeria { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .tarjeta { background: white; padding: 10px; border-radius: 15px; box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .galeria img { width: 280px; height: 350px; object-fit: cover; border-radius: 10px; display: block; }
        .pie-foto { margin-top: 8px; font-weight: bold; color: #495057; }
    </style>
</head>
<body>

    <h1>Blog del Amor 💖</h1>
    <p>Página de pruebas con píxel de seguimiento activo</p>
    
    <div class="galeria">
        <div class="tarjeta">
            <img src="https://unsplash.com" alt="Amor 1">
            <div class="pie-foto">Imagen de prueba 1</div>
        </div>
        <div class="tarjeta">
            <img src="https://unsplash.com" alt="Amor 2">
            <div class="pie-foto">Imagen de prueba 2</div>
        </div>
        <div class="tarjeta">
            <img src="https://unsplash.com" alt="Amor 3">
            <div class="pie-foto">Imagen de prueba 3</div>
        </div>
        <div class="tarjeta">
            <img src="https://unsplash.com" alt="Amor 4">
            <div class="pie-foto">Imagen de prueba 4</div>
        </div>
    </div>

</body>
</html>
