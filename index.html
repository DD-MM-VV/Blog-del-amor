<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog del Amor - Galería de Imágenes</title>
    
    <!-- Aquí pegaremos el código <head> de Google Tag Manager más adelante -->
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff0f5; text-align: center; padding: 20px; }
        h1 { color: #d63384; }
        .galeria { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; }
        .galeria img { width: 300px; height: 200px; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- Aquí pegaremos el código <body> de Google Tag Manager más adelante -->

    <h1>Blog del Amor 💖</h1>
    <p>Esta es mi página de imágenes de prueba para medir con el píxel.</p>
    
    <div class="galeria">
        <img src="https://picsum.photos" alt="Imagen de prueba 1">
        <img src="https://picsum.photos" alt="Imagen de prueba 2">
        <img src="https://picsum.photos" alt="Imagen de prueba 3">
        <img src="https://picsum.photos" alt="Imagen de prueba 4">
    </div>

</body>
</html>
